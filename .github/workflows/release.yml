name: Release

# Đẩy tag dạng v1.2.3 để build exe và tạo GitHub Release có file zip tải về.
# Chạy tay (workflow_dispatch) thì chỉ build và đính kèm file zip vào lần chạy (artifact), không tạo Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read  # SignPath đọc thông tin job và tải artifact

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cài phụ thuộc
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Test trước khi đóng gói
        env:
          TDK_DATA_DIR: ${{ runner.temp }}\tdk-data
        run: python -m pytest -q

      - name: Đóng gói
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name ttwatch
          --add-data "static;static"
          --collect-submodules uvicorn --collect-submodules pystray
          app.py

      # Ký số bằng SignPath Foundation (miễn phí cho mã nguồn mở). Chỉ chạy khi build từ tag và repo đã
      # khai báo biến SIGNPATH_ORGANIZATION_ID + secret SIGNPATH_API_TOKEN; chưa có thì exe giữ nguyên chưa ký.
      # Cách thiết lập: docs/code-signing.md. Ký trước khi chạy thử để thử đúng file sẽ phát hành.
      - name: Tải exe chưa ký lên để ký
        id: upload-unsigned
        if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: ttwatch-unsigned-exe
          path: dist\ttwatch\ttwatch.exe

      - name: Ký số bằng SignPath
        id: sign
        if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ttwatch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Người phê duyệt có tối đa 1 giờ để bấm duyệt yêu cầu ký.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Thay exe bằng bản đã ký và kiểm tra chữ ký
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed\ttwatch.exe dist\ttwatch\ttwatch.exe -Force
          $sig = Get-AuthenticodeSignature dist\ttwatch\ttwatch.exe
          Write-Host "Chữ ký: $($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "Chữ ký không hợp lệ: $($sig.Status)" }

      - name: Chạy thử exe vừa build (khởi động, ping, tắt)
        shell: pwsh
        env:
          TDK_DATA_DIR: ${{ runner.temp }}\exe-smoke
          NO_OPEN: "1"
          NO_TRAY: "1"
        run: |
          $exe = "dist\ttwatch\ttwatch.exe"
          $p = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping -TimeoutSec 2
              if ($r.app -eq "theo-doi-kenh-tiktok") { $ok = $true }
            } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "Exe không phản hồi /api/ping" }
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "ttwatch") { throw "Trang chủ không đúng" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8765/api/shutdown | Out-Null
          $p.WaitForExit(10000) | Out-Null
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Exe chạy được: ping, trang chủ, tắt."

      - name: Đặt tên và nén
        id: pack
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "ttwatch-$ver-win64.zip"
          Copy-Item LICENSE dist\ttwatch\LICENSE
          Compress-Archive -Path dist\ttwatch -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "$zip  sha256=$hash"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.pack.outputs.zip }}.sha256
          retention-days: 30

      - name: Tạo GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.pack.outputs.zip }}"
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" `
            --title "ttwatch $env:GITHUB_REF_NAME" --generate-notes
