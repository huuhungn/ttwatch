name: Release

# Push a tag like v1.2.3 to build the exe and create a GitHub Release with a downloadable zip and a Setup.exe.
# A manual run (workflow_dispatch) only builds and attaches the zip to the run (artifact); it creates no Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read  # SignPath reads job info and downloads the artifact
  id-token: write      # build provenance attestation (Sigstore)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The app compares version.py with the latest release to decide whether to update itself. A binary whose
      # version.py differs from its tag would see its own release as "newer" and offer to update to itself forever.
      - name: Check that the tag matches version.py
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME does not match version.py ($v). Bump version.py and the CHANGELOG first." }

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Test before packaging
        env:
          TDK_DATA_DIR: ${{ runner.temp }}\tdk-data
        run: python -m pytest -q

      - name: Package
        shell: pwsh
        run: ./build.ps1

      # Code signing via SignPath Foundation (free for open source). Runs only for tag builds when the repo
      # defines the SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN secret; otherwise the exe stays unsigned.
      # Setup: docs/code-signing.md. Signing happens before the smoke test so that the exact file to be released is tested.
      - name: Upload the unsigned exe for signing
        id: upload-unsigned
        if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: ttwatch-unsigned-exe
          path: dist\ttwatch\ttwatch.exe

      - name: Sign with SignPath
        id: sign
        if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ttwatch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # The approver has up to 1 hour to approve the signing request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Replace the exe with the signed one and verify the signature
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed\ttwatch.exe dist\ttwatch\ttwatch.exe -Force
          $sig = Get-AuthenticodeSignature dist\ttwatch\ttwatch.exe
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "Invalid signature: $($sig.Status)" }

      - name: Smoke-test the built exe (start, ping, shut down)
        shell: pwsh
        env:
          TDK_DATA_DIR: ${{ runner.temp }}\exe-smoke
          NO_OPEN: "1"
          NO_TRAY: "1"
        run: |
          $exe = "dist\ttwatch\ttwatch.exe"
          $p = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping -TimeoutSec 2
              if ($r.app -eq "theo-doi-kenh-tiktok") { $ok = $true }
            } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "The exe did not respond to /api/ping" }
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "ttwatch") { throw "Unexpected home page" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8765/api/shutdown | Out-Null
          $p.WaitForExit(10000) | Out-Null
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "The exe works: ping, home page, shutdown."

      - name: Name and zip
        id: pack
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "ttwatch-$ver-win64.zip"
          Copy-Item LICENSE dist\ttwatch\LICENSE
          Compress-Archive -Path dist\ttwatch -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "$zip  sha256=$hash"

      # The Setup.exe is an extra download; the in-app updater keeps using the zip. The "older" installer is the same
      # files under a lower version, only there to prove that installing over a running, older copy works.
      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
          $ver = python -c "from version import __version__; print(__version__)"
          ./packaging/build_installer.ps1 -Version 0.0.1
          ./packaging/build_installer.ps1
          "version=$ver" >> $env:GITHUB_OUTPUT
          "setup=dist/installer/ttwatch-v$ver-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the installer (fresh install, upgrade over a running copy, uninstall)
        shell: pwsh
        run: >
          ./scripts/ci/installer_smoke.ps1
          -OldInstaller dist/installer/ttwatch-v0.0.1-Setup.exe -OldVersion 0.0.1
          -NewInstaller ${{ steps.installer.outputs.setup }} -NewVersion ${{ steps.installer.outputs.version }}

      # A free cryptographic signature that ties the zip to the repo, commit and workflow that built it. It does not
      # replace an Authenticode signature (SmartScreen ignores it), but anyone can verify it: gh attestation verify <zip> -R huuhungn/ttwatch
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.installer.outputs.setup }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.pack.outputs.zip }}.sha256
            ${{ steps.installer.outputs.setup }}
            ${{ steps.installer.outputs.setup }}.sha256
          retention-days: 30

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.pack.outputs.zip }}"
          $setup = "${{ steps.installer.outputs.setup }}"
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" $setup "$setup.sha256" `
            --title "ttwatch $env:GITHUB_REF_NAME" --generate-notes
