name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The tool runs on Windows (msvcrt file lock, system tray); Windows runners ship Chrome and Edge
    # for the Playwright UI tests.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (undefined names, syntax errors)
        run: ruff check --select F,E9 .

      - name: Check JS syntax
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem static -Filter *.js) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error: $($f.Name)" }
          }

      - name: Test
        env:
          TDK_DATA_DIR: ${{ runner.temp }}\tdk-data
        run: python -m pytest -q

      - name: UI screenshots from tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screens
          path: docs/screens/*.png
          if-no-files-found: ignore
          retention-days: 7
