<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theo dõi kênh Tiktok</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="logo"><img src="/static/logo.svg" alt="">Theo dõi kênh Tiktok</div>
    <a class="btn-group" href="https://www.facebook.com/groups/815190970340230" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Tham gia nhóm MFG - Kiếm Tiền Tiktok Global
    </a>
    <a class="btn-author" href="https://www.facebook.com/duckuongg/" target="_blank" rel="noopener" title="Facebook tác giả">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
      Facebook tác giả
    </a>
    <div class="spacer"></div>
    <div class="worker" id="worker"></div>
    <button class="btn" id="btnSettings">⚙ Cài đặt</button>
  </header>

  <div class="add-box">
    <textarea id="input" placeholder="Dán link kênh / link video / username vào đây – mỗi dòng một kênh, hoặc cách nhau bởi dấu phẩy, khoảng trắng.&#10;Ví dụ: https://www.tiktok.com/@abc   @xyz   https://vt.tiktok.com/ZSxxxx/"></textarea>
    <div class="add-side">
      <div class="add-scan">Quét: <div id="addScan"></div></div>
      <span class="detect" id="detect">Ctrl + Enter để thêm nhanh</span>
      <button class="btn primary" id="btnAdd">+ Thêm kênh</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Tìm username, tên kênh, ghi chú…">
    <select id="groupFilter"><option value="">Tất cả nhóm</option></select>
    <button class="btn" id="btnRefreshAll" title="Cập nhật follow, tim và các video mới nhất của tất cả kênh">↻ Cập nhật tất cả</button>
    <button class="btn" id="btnScan" title="Quét video theo số lượng hoặc theo ngày cho các kênh đang chọn (hoặc tất cả)">⟳ Quét video…</button>
    <div class="spacer"></div>
    <button class="btn" id="btnCompact" title="Hiển thị số dạng rút gọn 1,2M">1,2M</button>
    <button class="btn" id="btnColumns">☰ Cột</button>
    <button class="btn" id="btnExport">⬇ Xuất Excel</button>
  </div>

  <div class="table-wrap" id="table"></div>
  <div class="statusbar" id="statusbar"></div>

  <dialog id="dlgSettings">
    <h3>Cài đặt</h3>
    <div class="field row">
      <input type="checkbox" id="setShowBrowser">
      <label for="setShowBrowser">Hiện cửa sổ trình duyệt khi quét</label>
    </div>
    <div class="field"><small>Bật khi TikTok hiện captcha: bạn giải captcha (hoặc đăng nhập) một lần trong cửa sổ đó, tool sẽ ghi nhớ.</small></div>
    <div class="field">
      <label for="setAuto">Tự động cập nhật mỗi (phút)</label>
      <input type="number" id="setAuto" min="0" step="5">
      <small>0 = tắt. Tool chỉ tự cập nhật khi đang mở.</small>
    </div>
    <div class="dlg-actions">
      <button class="btn danger" id="btnShutdown" style="margin-right:auto" title="Tắt hẳn tool (dừng quét). Mở lại bằng file exe.">⏻ Tắt tool</button>
      <button class="btn" id="setCancel">Hủy</button>
      <button class="btn primary" id="setSave">Lưu</button>
    </div>
  </dialog>

  <dialog id="dlgPrompt">
    <h3 id="promptTitle"></h3>
    <div class="field">
      <input type="text" id="promptInput" list="groupList">
      <datalist id="groupList"></datalist>
      <small id="promptHint"></small>
    </div>
    <div class="dlg-actions">
      <button class="btn" id="promptCancel">Hủy</button>
      <button class="btn primary" id="promptOk">OK</button>
    </div>
  </dialog>

  <script src="/static/common.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
