<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách video</title>
  <link rel="icon" href="/static/ttwatch.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/extra.css">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      if (localStorage.getItem("dense") === "1") addEventListener("DOMContentLoaded", () => document.body.classList.add("dense"));
    } catch {}
  </script>
</head>
<body>
  <header class="top">
    <a class="logo" href="/" style="text-decoration:none"><img src="/static/ttwatch.svg" alt="">ttwatch</a>
    <div class="spacer"></div>
    <div class="worker" id="worker" aria-live="polite"></div>
    <a class="btn" href="/" style="text-decoration:none">← Danh sách kênh</a>
  </header>

  <div class="ch-head" id="chHead"></div>
  <div class="cards" id="summary" style="padding:6px 16px 0"></div>
  <details class="panel" id="analysis" style="margin:10px 16px 0">
    <summary style="cursor:pointer;font-weight:600">Phân tích các video đang hiển thị</summary>
    <div class="grid2" style="margin-top:10px">
      <div><h4 style="margin:0 0 6px">View theo ngày đăng</h4><div id="anTimeline"></div></div>
      <div><h4 style="margin:0 0 6px">Phân bố view</h4><div id="anDist"></div>
        <h4 style="margin:12px 0 6px">Giờ đăng hiệu quả (view trung bình)</h4><div id="anHeat"></div></div>
    </div>
  </details>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Tìm trong mô tả, hashtag, nhạc…">
    <select id="period">
      <option value="0">Mọi thời gian</option>
      <option value="last">Kết quả lần quét gần nhất</option>
      <option value="7">7 ngày qua</option>
      <option value="30">30 ngày qua</option>
      <option value="90">90 ngày qua</option>
      <option value="365">1 năm qua</option>
      <option value="range">Khoảng ngày…</option>
    </select>
    <span id="rangeBox" class="scan-opts" style="display:none">
      <input type="date" id="fromDate"> → <input type="date" id="toDate">
    </span>
    <button class="btn" id="btnQuick">↻ Cập nhật nhanh</button>
    <button class="btn" id="btnScan">⟳ Quét video…</button>
    <div class="spacer"></div>
    <button class="btn" id="btnCopyAll">⧉ Sao chép tất cả link</button>
    <button class="btn" id="btnCompact" title="Hiển thị số dạng rút gọn 1,2M">1,2M</button>
    <button class="btn" id="btnColumns">☰ Cột</button>
    <button class="btn" id="btnExport">⬇ Xuất Excel</button>
    <button class="btn" id="btnCsv" title="Xuất CSV (UTF-8, mở được bằng Excel)">⬇ CSV</button>
  </div>

  <div class="table-wrap" id="table"></div>
  <div class="statusbar" id="statusbar"></div>

  <script src="/static/common.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/videos.js"></script>
</body>
</html>
